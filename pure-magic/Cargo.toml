[package]
name = "pure-magic"
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
description = "Safe Rust re-implementation of libmagic"
repository.workspace = true
license.workspace = true
keywords = ["file", "identification", "libmagic", "magic", "mime"]

[dependencies]
# Disable default features to avoid dependency on heapless 0.7, to avoid dependency on atomic-polyfill (unmaintained)
# see also https://github.com/jamesmunns/postcard/issues/223
postcard = { version = "1.1.3", features = ["use-std"], default-features = false }
chrono = "0.4.41"
csv = "1.3.1"
dyf = { version = "0.2.1", features = ["serde"] }
flaglet = { version = "0.1.0" }
flate2 = "1.1.4"
memchr = "2.7.6"
memmap2 = "0.9.8"
pest = "2.7.14"
pest_derive = "2.7.14"
regex = "1.11.1"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.145"
tar = "0.4.44"
thiserror = "2.0.12"
tracing = "0.1.41"
uuid = "1.18.1"

[dev-dependencies]
tracing-subscriber = { version = "0.3.19" }
