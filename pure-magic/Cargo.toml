[package]
name = "pure-magic"
version = "0.2.4"
edition.workspace = true
rust-version.workspace = true
description = "Safe Rust re-implementation of libmagic"
repository.workspace = true
license.workspace = true
keywords = ["file", "identification", "libmagic", "magic", "mime"]

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
chrono = "0.4.41"
csv = "1.3.1"
dyf = { version = "0.1.1", features = ["serde"] }
flagset = { version = "0.4.7", features = ["serde"] }
flate2 = "1.1.4"
memchr = "2.7.6"
memmap2 = "0.9.8"
pest = "2.7.14"
pest_derive = "2.7.14"
regex = "1.11.1"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.145"
tar = "0.4.44"
thiserror = "2.0.12"
tracing = "0.1.41"
uuid = "1.18.1"

[dev-dependencies]
tracing-subscriber = { version = "0.3.19" }
